<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" role="img" aria-label="ENCOMM — Enterprise AI">
  <title>ENCOMM — Enterprise AI</title>
  <defs>
    <linearGradient id="lv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A07BFF"/><stop offset="1" stop-color="#5E48D6"/>
    </linearGradient>
    <linearGradient id="ll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4CFFF"/><stop offset="1" stop-color="#B79BFF"/>
    </linearGradient>
    <linearGradient id="lc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#66D7F5"/><stop offset="1" stop-color="#9BE7FB"/>
    </linearGradient>
    <linearGradient id="lm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7A8F5"/><stop offset="1" stop-color="#C088E8"/>
    </linearGradient>
  </defs>
  <!-- Mark -->
  <g transform="translate(8 12) scale(0.76)">
    <polygon points="80,12 134,42 134,118 80,148 26,118 26,42" fill="url(#lv)"/>
    <polygon points="80,12 134,42 80,72" fill="url(#ll)"/>
    <polygon points="134,42 134,118 80,88" fill="#7C66E8"/>
    <polygon points="134,118 80,148 80,88" fill="url(#lm)" opacity="0.92"/>
    <polygon points="80,148 26,118 80,88" fill="#5E48D6"/>
    <polygon points="26,118 26,42 80,72" fill="#6E54D6"/>
    <polygon points="26,42 80,12 80,72" fill="url(#lc)" opacity="0.92"/>
    <g opacity="0.95">
      <rect x="58" y="64" width="44" height="6" rx="3" fill="#FFFFFF"/>
      <rect x="58" y="77" width="44" height="6" rx="3" fill="#F2ECFF"/>
      <rect x="58" y="90" width="44" height="6" rx="3" fill="#FFFFFF"/>
      <rect x="58" y="64" width="6" height="32" rx="3" fill="#FFFFFF"/>
    </g>
  </g>
  <!-- Wordmark ENCOMM -->
  <g fill="#101426" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-weight="600">
    <text x="146" y="58" font-size="30" letter-spacing="6">ENCOMM</text>
    <text x="147" y="78" font-size="9.5" letter-spacing="4.2" fill="#626A7F" font-weight="500">ENTERPRISE AI</text>
